<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Intelbras Bio-T - Controle ESP32</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 500px; margin: auto; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: none; box-sizing: border-box; }
    input { background: #2c2c2c; color: #fff; }
    button { background: #007bff; color: #fff; font-weight: bold; cursor: pointer; }
    button:hover { background: #0056b3; }
    #log { margin-top: 15px; padding: 10px; background: #000; border-radius: 4px; font-family: monospace; white-space: pre-wrap; font-size: 12px; min-height: 80px; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>

<div class="card">
  <h2>Conectar Intelbras Bio-T</h2>
  
  <label>IP do Bio-T (Rede Local):</label>
  <input type="text" id="ipBioT" value="192.168.1.50" placeholder="Ex: 192.168.1.50">

  <label>Usuário:</label>
  <input type="text" id="usuarioBioT" value="admin">

  <label>Senha:</label>
  <input type="password" id="senhaBioT" placeholder="Sua senha do Bio-T">

  <button onclick="enviarComandoTeste()">Testar Conexão (Digest Auth)</button>

  <label>Status da Execução:</label>
  <div id="log">Aguardando comando...</div>
</div>

<script>
  const SUPABASE_URL = "https://hvaibexymmbuvvuzjzld.supabase.co/rest/v1";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2YWliZXh5bW1idXZ2dXpqemxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NTYxMTAsImV4cCI6MjEwNDUzMjExMH0.s6dow6xW_VmiTL4Qwa4vRbh154OaMx3QZlhhEWrv-P8";

  async function enviarComandoTeste() {
    const ip = document.getElementById('ipBioT').value;
    const usuario = document.getElementById('usuarioBioT').value;
    const senha = document.getElementById('senhaBioT').value;
    const log = document.getElementById('log');

    if (!ip || !senha) {
      alert("Por favor, preencha o IP e a Senha do Bio-T.");
      return;
    }

    log.innerText = "[1/3] Enviando comando para a fila do Supabase...";

    // 1. Insere o comando na tabela 'fila_comandos'
    try {
      const response = await fetch(`${SUPABASE_URL}/fila_comandos`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Prefer": "return=representation"
        },
        body: JSON.stringify({
          comando: "TESTAR_CONEXAO",
          payload: { ip, usuario, senha }
        })
      });

      const data = await response.json();
      const comandoId = data[0].id;
      
      log.innerText = `[2/3] Comando criado (ID: ${comandoId}). Aguardando ESP32 processar...`;

      // 2. Faz polling para aguardar a resposta do ESP32
      aguardarRespostaESP32(comandoId);

    } catch (err) {
      log.innerText = "[ERRO] Falha ao enviar para o Supabase: " + err.message;
    }
  }

  function aguardarRespostaESP32(comandoId) {
    const log = document.getElementById('log');
    
    const interval = setInterval(async () => {
      try {
        const res = await fetch(`${SUPABASE_URL}/fila_comandos?id=eq.${comandoId}`, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        });
        
        const data = await res.json();
        const cmd = data[0];

        if (cmd.status === "PROCESSANDO") {
          log.innerText = "[3/3] ESP32 capturou o comando. Calculando Digest Auth MD5 no Bio-T...";
        } else if (cmd.status === "CONCLUIDO") {
          clearInterval(interval);
          log.innerText = "SUCCESS! RESPOSTA DO BIO-T:\n" + cmd.resposta;
        } else if (cmd.status === "ERRO") {
          clearInterval(interval);
          log.innerText = "ERRO NA EXECUÇÃO:\n" + cmd.resposta;
        }
      } catch (err) {
        clearInterval(interval);
        log.innerText = "[ERRO] Falha ao checar status: " + err.message;
      }
    }, 1500); // Checa o status a cada 1.5s
  }
</script>

</body>
</html>
